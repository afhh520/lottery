<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>快乐8+双色球 数据记录</title>
    <style>
        :root {
            --bg: #f5f0eb; --card: #ffffff; --text: #3e3232; --k8: #c0392b; --ssq: #2980b9;
            --hot: #fce4e4; --warm: #fff3e0; --cold: #e3f2fd; --border: #e8e0d5;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:var(--bg); color:var(--text); padding-bottom:70px; }
        .header { background:var(--card); padding:12px 16px; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
        .tabs { display:flex; gap:4px; background:#f0ebe0; border-radius:20px; padding:3px; }
        .tabs button { padding:8px 16px; border:none; border-radius:20px; font-weight:600; font-size:0.9rem; background:transparent; color:#8b7e74; }
        .tabs button.active { background:#fff; color:var(--k8); box-shadow:0 1px 6px rgba(0,0,0,0.1); }
        .main { max-width:600px; margin:0 auto; padding:12px 14px; }
        .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 12px rgba(0,0,0,0.06); }
        .title { font-weight:700; font-size:0.95rem; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
        .balls { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
        .ball { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:#fff; }
        .k8-red { background:var(--k8); } .ssq-red { background:#e74c3c; } .ssq-blue { background:var(--ssq); }
        .small-ball { width:28px; height:28px; font-size:0.7rem; }
        .btn { padding:8px 16px; border-radius:20px; border:none; font-weight:600; font-size:0.8rem; cursor:pointer; background:#f0ebe0; color:#6b4d2a; margin-top:8px; }
        .btn-primary { background:var(--k8); color:#fff; }
        .btn-rule { background:transparent; border:1px solid #d4c8b0; color:#8b7e74; font-size:0.7rem; padding:4px 10px; border-radius:12px; }
        .btn-copy { background:#f0ebe0; color:#6b4d2a; border:1px solid #d4c8b0; padding:5px 10px; border-radius:14px; font-size:0.7rem; }
        .bottom { position:fixed; bottom:0; left:0; right:0; background:var(--card); display:flex; border-top:1px solid var(--border); padding:8px 0; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
        .bottom button { flex:1; padding:12px; border:none; background:transparent; font-weight:600; font-size:0.8rem; color:#8b7e74; }
        .bottom button.active { color:var(--k8); }
        .combo-row { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 16px; border-radius:20px; font-size:0.8rem; z-index:300; }
        .hidden { display:none!important; }
        .zone-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
        .zone-item { border-radius:12px; padding:12px 6px; text-align:center; border:1px solid transparent; font-weight:600; }
        .zone-item.hot { background:var(--hot); border-color:#f5c6c6; color:#b71c1c; }
        .zone-item.warm { background:var(--warm); border-color:#ffe0b2; color:#e65100; }
        .zone-item.cold { background:var(--cold); border-color:#bbdefb; color:#0d47a1; }
        .zone-label { font-size:0.75rem; font-weight:700; margin-bottom:4px; }
        .zone-count { font-size:1.1rem; font-weight:800; }
        .zone-tag { font-size:0.7rem; font-weight:700; margin-top:2px; }
        .draw-info { font-size:0.85rem; color:#6b5d4f; margin-bottom:10px; }
        .alert { background:#fff3cd; border:1px solid #ffc107; border-radius:12px; padding:10px; margin-bottom:10px; font-size:0.8rem; }
        .rule-modal { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
        .rule-content { background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:500px; max-height:70vh; overflow-y:auto; padding:20px; }
    </style>
</head>
<body>
<div class="header"><strong>🎲 彩票数据记录</strong><div class="tabs"><button id="tabK8" class="active">快乐8</button><button id="tabSSQ">双色球</button></div></div>
<div class="main" id="main"></div>
<div class="bottom"><button id="navDraw" class="active">走势</button><button id="navBook">账本</button><button id="navInfo">免责</button></div>
<div id="toast" class="hidden"></div>
<div id="ruleModal" class="rule-modal hidden"><div id="ruleContent" class="rule-content"></div></div>

<script>
(function(){
// ==================== 内置默认数据（仅用于首次加载） ====================
const K8_DEF=[{period:'2026134',date:'2026-05-24',numbers:[6,12,19,20,21,22,27,30,31,32,34,42,51,54,57,66,70,71,72,75]},{period:'2026133',date:'2026-05-23',numbers:[1,6,9,16,18,19,21,26,27,29,55,58,59,60,62,66,73,74,76,80]},{period:'2026132',date:'2026-05-22',numbers:[2,6,10,14,19,23,27,30,34,38,41,45,48,51,55,58,62,66,70,75]},{period:'2026131',date:'2026-05-21',numbers:[4,8,12,16,21,26,32,37,43,50,54,59,63,67,71,73,76,77,78,79]},{period:'2026130',date:'2026-05-20',numbers:[3,11,15,19,22,25,28,31,35,39,42,44,47,50,53,57,60,64,68,72]},{period:'2026129',date:'2026-05-19',numbers:[1,5,9,13,17,20,24,27,30,34,38,41,45,48,52,56,59,63,67,71]},{period:'2026128',date:'2026-05-18',numbers:[2,6,10,14,18,23,26,29,33,36,40,43,46,49,51,55,58,62,66,70]},{period:'2026127',date:'2026-05-17',numbers:[4,8,12,16,21,25,32,37,44,50,54,57,61,65,69,73,74,76,78,80]},{period:'2026126',date:'2026-05-16',numbers:[3,7,11,15,19,22,26,30,34,38,42,45,48,51,54,58,62,66,70,74]},{period:'2026125',date:'2026-05-15',numbers:[1,5,9,13,17,20,24,28,31,35,39,43,46,50,53,56,60,64,68,72]}];
const SSQ_DEF=[{period:'2026058',date:'2026-05-24',reds:[1,4,7,21,29,30],blue:1},{period:'2026057',date:'2026-05-21',reds:[1,10,22,24,28,30],blue:7},{period:'2026056',date:'2026-05-19',reds:[10,19,21,22,31,33],blue:5},{period:'2026055',date:'2026-05-17',reds:[4,11,24,25,32,33],blue:13},{period:'2026054',date:'2026-05-14',reds:[13,20,25,29,30,33],blue:2},{period:'2026053',date:'2026-05-12',reds:[1,2,3,8,13,14],blue:2},{period:'2026052',date:'2026-05-10',reds:[1,3,11,22,26,31],blue:11},{period:'2026051',date:'2026-05-07',reds:[9,14,15,16,29,30],blue:10},{period:'2026050',date:'2026-05-05',reds:[6,9,25,27,28,30],blue:3},{period:'2026049',date:'2026-05-03',reds:[3,4,14,15,18,20],blue:2}];

const S={tab:'k8',page:'draw',k8Data:null,ssqData:null,k8H:[],ssqH:[],bets:[]};
const z16=n=>Math.ceil(n/5), z7=n=>n<=5?1:n<=10?2:n<=15?3:n<=20?4:n<=25?5:n<=30?6:7;
function sortN(a,b){return a-b;}

// 存储
function load(){
    try{const d=JSON.parse(localStorage.getItem('lottery_v20'));if(d){S.bets=d.bets||[];S.k8H=d.k8H||[];S.ssqH=d.ssqH||[];S.k8Data=d.k8Data||null;S.ssqData=d.ssqData||null;}}catch(e){}
    if(!S.k8H.length)S.k8H=K8_DEF.slice();if(!S.ssqH.length)S.ssqH=SSQ_DEF.slice();
    if(!S.k8Data)S.k8Data=S.k8H[0];if(!S.ssqData)S.ssqData=S.ssqH[0];
}
function save(){localStorage.setItem('lottery_v20',JSON.stringify({bets:S.bets,k8H:S.k8H.slice(0,60),ssqH:S.ssqH.slice(0,60),k8Data:S.k8Data,ssqData:S.ssqData}));}

// Toast
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000);}

// 复制功能
function copyText(text){
    if(!text)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('✅ 已复制')).catch(()=>fallbackCopy(text));}
    else fallbackCopy(text);
}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}document.body.removeChild(ta);}

// 手动录入弹窗
function openManual(){
    const tab=S.tab;
    let formHtml='';
    if(tab==='k8'){
        formHtml='<h3>手动录入快乐8开奖号</h3><input id="manPeriod" placeholder="期号 如2026135" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manNums" placeholder="号码(空格分隔) 如 01 05 12 ..." style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><button class="btn btn-primary" id="saveManK8" style="width:100%">保存并更新</button>';
    }else{
        formHtml='<h3>手动录入双色球开奖号</h3><input id="manPeriod" placeholder="期号 如2026059" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manReds" placeholder="红球(空格分隔) 如 01 04 07 21 29 30" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manBlue" placeholder="蓝球 如 01" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><button class="btn btn-primary" id="saveManSSQ" style="width:100%">保存并更新</button>';
    }
    const modal=document.createElement('div');
    modal.className='rule-modal';
    modal.innerHTML='<div class="rule-content">'+formHtml+'<button class="btn" style="width:100%;margin-top:12px" id="closeManual">关闭</button></div>';
    document.body.appendChild(modal);
    document.getElementById('closeManual').onclick=()=>modal.remove();
    modal.onclick=function(e){if(e.target===modal) modal.remove();};

    if(tab==='k8'){
        document.getElementById('saveManK8').onclick=()=>{
            const period=document.getElementById('manPeriod').value.trim();
            const numsStr=document.getElementById('manNums').value.trim();
            if(!period||!numsStr) return alert('请填写完整');
            const numbers=numsStr.split(/\s+/).map(Number).filter(n=>n>=1&&n<=80).sort(sortN);
            if(numbers.length!==20) return alert('需20个号码');
            S.k8Data={period,date:new Date().toISOString().slice(0,10),numbers};
            const idx=S.k8H.findIndex(h=>h.period===period);
            if(idx>=0) S.k8H[idx]=S.k8Data; else S.k8H.unshift(S.k8Data);
            save(); modal.remove(); render(); toast('快乐8数据已更新');
        };
    }else{
        document.getElementById('saveManSSQ').onclick=()=>{
            const period=document.getElementById('manPeriod').value.trim();
            const redsStr=document.getElementById('manReds').value.trim();
            const blue=parseInt(document.getElementById('manBlue').value);
            if(!period||!redsStr||isNaN(blue)) return alert('请填写完整');
            const reds=redsStr.split(/\s+/).map(Number).filter(n=>n>=1&&n<=33).sort(sortN);
            if(reds.length!==6) return alert('红球需6个号码');
            if(blue<1||blue>16) return alert('蓝球需1-16');
            S.ssqData={period,date:new Date().toISOString().slice(0,10),reds,blue};
            const idx=S.ssqH.findIndex(h=>h.period===period);
            if(idx>=0) S.ssqH[idx]=S.ssqData; else S.ssqH.unshift(S.ssqData);
            save(); modal.remove(); render(); toast('双色球数据已更新');
        };
    }
}

// 数据同步 (添加错误处理与重试提示)
async function syncData(){
    toast('更新中…');
    let updated=false;
    try{
        const[k8r,ssqr]=await Promise.all([
            fetch('https://m.zhcw.com/clienth5.do?lottery=FC_KL8&pageSize=1&pageNo=1&transactionType=300301',{mode:'cors'}),
            fetch('https://m.zhcw.com/clienth5.do?lottery=FC_SSQ&pageSize=1&pageNo=1&transactionType=300301',{mode:'cors'})
        ]);
        if(k8r.ok){const j=await k8r.json();if(j?.dataList?.length){const it=j.dataList[0];const nums=it.kjznum.split(' ').map(Number).sort(sortN);if(nums.length===20){S.k8Data={period:it.kjIssue,date:it.kjdate,numbers:nums};const idx=S.k8H.findIndex(h=>h.period===it.kjIssue);if(idx>=0)S.k8H[idx]=S.k8Data;else S.k8H.unshift(S.k8Data);updated=true;}}}
        if(ssqr.ok){const j=await ssqr.json();if(j?.dataList?.length){const it=j.dataList[0];const reds=it.kjznum.split(' ').map(Number).sort(sortN);const blue=parseInt(it.kjtnum);if(reds.length===6&&blue>=1&&blue<=16){S.ssqData={period:it.kjIssue,date:it.kjdate,reds,blue};const idx=S.ssqH.findIndex(h=>h.period===it.kjIssue);if(idx>=0)S.ssqH[idx]=S.ssqData;else S.ssqH.unshift(S.ssqData);updated=true;}}}
        save();
        if(updated){toast('✅ 数据已更新');}else{toast('⚠️ 暂无新数据，可手动录入');}
    }catch(e){
        toast('❌ 网络请求失败，请尝试手动录入');
        console.error(e);
    }
    // 自动结算
    autoSettle();
    render();
}

// 算法部分保持不变，此处省略以节省篇幅（您之前的完整算法保持）
// 请将之前完整的 get16ZoneStats, getActiveNumbers, getWarmNumbers, genK8Combos, 双色球各函数等粘贴在此处。
// ==================== 以下需完整复制之前的算法代码 ====================
// ... (因篇幅限制，这里不重复粘贴，实际使用时请保留您之前正常运行的所有算法函数)

// 自动投注与结算
function autoBetK8(period){ /* ... */ }
function autoSettle(){ /* ... */ }

// 规则弹窗
function openRule(type){ /* ... */ }

// 渲染函数（增加更新失败提示）
function render(){
    const m=document.getElementById('main');
    if(S.page==='draw'){
        if(S.tab==='k8'){
            // 检查数据新鲜度
            const lastDate = S.k8Data?.date;
            const today = new Date().toISOString().slice(0,10);
            let freshnessAlert = '';
            if(!lastDate || lastDate < today){
                freshnessAlert = '<div class="alert">⚠️ 数据可能不是最新，建议 <a href="javascript:void(0)" onclick="syncData()" style="color:#c0392b;font-weight:700">点击刷新</a> 或 <a href="javascript:void(0)" onclick="openManual()" style="color:#c0392b;font-weight:700">手动录入</a></div>';
            }
            const k=S.k8Data;
            // ... 构建快乐8的HTML，在开奖卡片下方加入 freshnessAlert
        }else{
            // 双色球同理
        }
    }
}

// 页面切换等...
})();
</script>
</body>
</html>
