// 弹窗提示
function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.remove('hidden');
    setTimeout(()=>t.classList.add('hidden'),2000);
}

// 复制文本
function copyText(text){
    if(!text)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>toast('✅ 复制成功')).catch(()=>fallbackCopy(text));
    }else fallbackCopy(text);
}
function fallbackCopy(text){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');toast('✅ 复制成功');}catch(e){toast('❌ 复制失败');}
    document.body.removeChild(ta);
}

//==================== 快乐8 全套核心算法 ====================
// 1.近5期热温号：出现≥2次，排除上期，最多4码升序
function getK8HotWarm(){
    if(S.k8H.length < 6) return [];
    const lastNums = S.k8H[0].numbers;
    const recent5 = S.k8H.slice(1,6);
    let freq = {};
    for(let i=1;i<=80;i++) freq[i] = 0;
    recent5.forEach(item=>item.numbers.forEach(n=>freq[n]++));
    let res = Object.entries(freq)
        .filter(([num,count])=>count >= 2 && !lastNums.includes(Number(num)))
        .map(x=>Number(x[0]))
        .sort(sortN);
    return res.slice(0,4);
}

// 2.横竖斜连号分析：近8期数据，排除上期，最多4码
function getK8Connect(){
    if(S.k8H.length < 8) return [];
    const lastNums = S.k8H[0].numbers;
    let connectSet = new Set();

    // 竖连：同期相邻号码
    S.k8H.slice(0,8).forEach(item=>{
        let arr = [...item.numbers].sort(sortN);
        for(let i=1;i<arr.length;i++){
            if(arr[i] - arr[i-1] === 1){
                connectSet.add(arr[i]);
                connectSet.add(arr[i-1]);
            }
        }
    });

    // 横连、斜连：跨期±1走势
    for(let i=1;i<8;i++){
        let curr = S.k8H[i].numbers;
        let prev = S.k8H[i-1].numbers;
        curr.forEach(n=>{
            if(prev.includes(n-1) || prev.includes(n+1)){
                connectSet.add(n);
            }
        });
    }

    let result = [...connectSet].filter(n=>!lastNums.includes(n)).sort(sortN);
    return result.slice(0,4);
}

// 3.尾号走势复盘：近10期热尾，排除上期，最多4码
function getK8Tail(){
    if(S.k8H.length < 10) return [];
    const lastNums = S.k8H[0].numbers;
    let tailFreq = {};
    for(let i=0;i<=9;i++) tailFreq[i] = 0;

    S.k8H.slice(0,10).forEach(item=>{
        item.numbers.forEach(n=>tailFreq[n%10]++);
    });

    let hotTails = Object.entries(tailFreq).filter(([_,v])=>v>=3).map(x=>Number(x[0]));
    let res = [];
    for(let num=1;num<=80;num++){
        if(hotTails.includes(num%10) && !lastNums.includes(num)){
            res.push(num);
        }
    }
    return res.sort(sortN).slice(0,4);
}

// 4.整合三大维度，生成5注选6
function genK8FiveGroup(){
    let pool = [...new Set([...getK8HotWarm(),...getK8Connect(),...getK8Tail()])].sort(sortN);
    // 兜底：如果池子里号码不够，补充一些近10期出现过的号
    if(pool.length < 6) {
        let fallbackPool = [];
        S.k8H.slice(0,10).forEach(item=>{
            item.numbers.forEach(n=>{
                if(!fallbackPool.includes(n) && !S.k8H[0].numbers.includes(n)){
                    fallbackPool.push(n);
                }
            });
        });
        pool = [...new Set([...pool, ...fallbackPool])].sort(sortN);
    }
    let combos = [];
    for(let i=0;i<5;i++){
        let temp = [...pool].sort(()=>0.5-Math.random());
        combos.push(temp.slice(0,6).sort(sortN));
    }
    return combos;
}

//==================== 双色球 全套核心算法 ====================
// 1.4胆参考：近30期高频+近5期活跃，排除上期
function getSSQFourDan(){
    if(S.ssqH.length < 10) return [];
    const lastRed = S.ssqH[0].reds;
    const recent5 = S.ssqH.slice(0,5);
    const recent10 = S.ssqH.slice(0,10);

    let freq5 = {}, freq10 = {};
    for(let i=1;i<=33;i++){freq5[i]=0;freq10[i]=0;}
    recent5.forEach(d=>d.reds.forEach(r=>freq5[r]++));
    recent10.forEach(d=>d.reds.forEach(r=>freq10[r]++));

    let danList = [];
    for(let r=1;r<=33;r++){
        if(freq10[r]>=3 && freq5[r]>=1 && !lastRed.includes(r)){
            danList.push(r);
        }
    }
    return danList.sort(sortN).slice(0,4);
}

// 2.近10期冷热/奇偶/三区走势分析
function getSSQTrend(){
    if(S.ssqH.length < 10) return {hot:[],cold:[],odd:0,even:0,zone:[0,0,0]};
    const list = S.ssqH.slice(0,10);
    let freq = {};
    let odd=0,even=0,zone=[0,0,0];
    for(let i=1;i<=33;i++) freq[i]=0;

    list.forEach(d=>{
        d.reds.forEach(r=>{
            freq[r]++;
            r%2===1 ? odd++ : even++;
            if(r<=11) zone[0]++;
            else if(r<=22) zone[1]++;
            else zone[2]++;
        });
    });

    let hot = Object.entries(freq).filter(([_,v])=>v>=3).map(x=>Number(x[0])).sort(sortN);
    let cold = Object.entries(freq).filter(([_,v])=>v<=1).map(x=>Number(x[0])).sort(sortN);
    return {hot,cold,odd,even,zone};
}

// 3.自动生成5注6红+1蓝单式
function genSSQFiveGroup(){
    let dan = getSSQFourDan();
    let trend = getSSQTrend();
    let redPool = [...new Set([...dan,...trend.hot])].sort(sortN);

    // 兜底：如果池子里号码不够，补充一些号
    if(redPool.length < 6) {
        let fallbackPool = [];
        S.ssqH.slice(0,10).forEach(item=>{
            item.reds.forEach(r=>{
                if(!fallbackPool.includes(r) && !S.ssqH[0].reds.includes(r)){
                    fallbackPool.push(r);
                }
            });
        });
        redPool = [...new Set([...redPool, ...fallbackPool])].sort(sortN);
    }

    // 蓝球取近5期热蓝
    let blueFreq = {};
    for(let i=1;i<=16;i++) blueFreq[i]=0;
    S.ssqH.slice(0,5).forEach(d=>blueFreq[d.blue]++);
    let hotBlue = Object.entries(blueFreq).filter(([_,v])=>v>=1).map(x=>Number(x[0]));

    let combos = [];
    for(let i=0;i<5;i++){
        let red = [...redPool].sort(()=>0.5-Math.random()).slice(0,6).sort(sortN);
        let blue = hotBlue.length ? hotBlue[Math.floor(Math.random()*hotBlue.length)] : Math.floor(Math.random()*16)+1;
        combos.push({red,blue});
    }
    return combos;
}

//==================== 对错标记逻辑（未开奖不打叉） ====================
function checkMark(reviewArr,drawArr,isK8=true){
    let html = '';
    let hitCount = null;
    // 未开奖，只展示号码，无对错标记
    if(!drawArr || drawArr.length === 0){
        reviewArr.forEach(n=>{
            html += `<span class="ball ${isK8?'k8-red':'ssq-red'} small-ball">${n}</span>`;
        });
        return {html,hitCount};
    }
    // 已开奖，自动比对打✔️✖️
    hitCount = 0;
    reviewArr.forEach(n=>{
        if(drawArr.includes(n)){
            html += `<span class="ball ${isK8?'k8-red':'ssq-red'} small-ball">${n}<span class="check-right">✔</span></span>`;
            hitCount++;
        }else{
            html += `<span class="ball ${isK8?'k8-red':'ssq-red'} small-ball">${n}</span>`;
        }
    });
    return {html,hitCount};
}

//==================== 自我学习迭代系统 ====================
function autoSelfLearn(){
    // 快乐8权重迭代
    if(S.k8H.length >= 2){
        let last = S.k8H[0].numbers;
        let preCombo = genK8FiveGroup()[0];
        let hit = preCombo.filter(n=>last.includes(n)).length;
        preCombo.forEach(n=>{
            S.learnWeight.k8[n] = (S.learnWeight.k8[n] || 0) + (hit >= 3 ? 0.1 : -0.05);
        });
    }
    // 双色球权重迭代
    if(S.ssqH.length >= 2){
        let lastRed = S.ssqH[0].reds;
        let preCombo = genSSQFiveGroup()[0].red;
        let hit = preCombo.filter(r=>lastRed.includes(r)).length;
        preCombo.forEach(r=>{
            S.learnWeight.ssq[r] = (S.learnWeight.ssq[r] || 0) + (hit >= 2 ? 0.1 : -0.05);
        });
    }
    save();
}

            let blueRight = S.ssqData.blue === item.blue;
            html += `
            <div style="margin:12px 0;">
                <div class="balls">
                    ${redRes.html}
                    <span class="ball ssq-blue small-ball">${item.blue}${blueRight?'<span class="check-right">✔</span>':''}</span>
                </div>
                <div class="note">第${idx+1}注 ${redRes.hitCount!==null ? '｜已完成开奖核对' : '｜待本期开奖'}</div>
                <button class="btn-copy copy-btn" data-copy="${item.red.join(',')} + 蓝${item.blue}">一键复制号码</button>
            </div>
            `;
        });
        html += `</div>`;
        main.innerHTML = html;
    }

    document.querySelectorAll('.copy-btn').forEach(btn=>btn.onclick=function(){
        copyText(this.dataset.copy);
    });
}

//==================== 页面切换事件 ====================
function switchTab(t){
    S.tab = t;
    document.getElementById('tabK8').classList.toggle('active',t==='k8');
    document.getElementById('tabSSQ').classList.toggle('active',t==='ssq');
    render();
}
function switchPage(p){
    S.page = p;
    ['navCompare','navInfo'].forEach(id=>document.getElementById(id).classList.remove('active'));
    document.getElementById(p).classList.add('active');
    render();
}

// 绑定点击事件
document.getElementById('tabK8').onclick = ()=>switchTab('k8');
document.getElementById('tabSSQ').onclick = ()=>switchTab('ssq');
document.getElementById('navCompare').onclick = ()=>switchPage('compare');
document.getElementById('navInfo').onclick = ()=>switchPage('navInfo');

// 初始化启动
load();
syncOfficialData();
// 每30分钟自动同步官方数据 + 自我学习
S.autoSyncTimer = setInterval(syncOfficialData, 1000 * 60 * 30);
render();

})();
</script>
