<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>快乐8+双色球 数据记录</title>
    <style>
        :root { --bg:#f5f0eb; --card:#fff; --text:#3e3232; --k8:#c0392b; --ssq:#2980b9; --hot:#fce4e4; --warm:#fff3e0; --cold:#e3f2fd; --border:#e8e0d5; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; background:var(--bg); color:var(--text); padding-bottom:70px; }
        .header { background:var(--card); padding:12px 16px; position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
        .tabs { display:flex; gap:4px; background:#f0ebe0; border-radius:20px; padding:3px; }
        .tabs button { padding:8px 16px; border:none; border-radius:20px; font-weight:600; background:transparent; color:#8b7e74; }
        .tabs button.active { background:#fff; color:var(--k8); }
        .main { max-width:600px; margin:0 auto; padding:12px; }
        .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
        .title { font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
        .balls { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
        .ball { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:#fff; }
        .k8-red { background:var(--k8); } .ssq-red { background:#e74c3c; } .ssq-blue { background:var(--ssq); }
        .small-ball { width:28px; height:28px; font-size:0.7rem; }
        .btn { padding:8px 16px; border-radius:20px; border:none; font-weight:600; background:#f0ebe0; color:#6b4d2a; margin-top:6px; cursor:pointer; }
        .btn-primary { background:var(--k8); color:#fff; }
        .btn-rule { background:transparent; border:1px solid #d4c8b0; color:#8b7e74; font-size:0.7rem; padding:4px 10px; border-radius:12px; }
        .btn-copy { background:#f0ebe0; color:#6b4d2a; border:1px solid #d4c8b0; padding:5px 10px; border-radius:14px; font-size:0.7rem; }
        .zone-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
        .zone-item { border-radius:12px; padding:10px 4px; text-align:center; font-weight:600; }
        .zone-item.hot { background:var(--hot); color:#b71c1c; } .zone-item.warm { background:var(--warm); color:#e65100; } .zone-item.cold { background:var(--cold); color:#0d47a1; }
        .bottom { position:fixed; bottom:0; left:0; right:0; background:var(--card); display:flex; border-top:1px solid var(--border); }
        .bottom button { flex:1; padding:12px; border:none; background:transparent; font-weight:600; color:#8b7e74; }
        .bottom button.active { color:var(--k8); }
        .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 16px; border-radius:20px; font-size:0.8rem; z-index:300; }
        .hidden { display:none!important; }
        .rule-modal { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
        .rule-content { background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:500px; max-height:70vh; overflow-y:auto; padding:20px; }
    </style>
</head>
<body>
<div class="header"><strong>🎲 彩票记录</strong><div class="tabs"><button id="tabK8" class="active">快乐8</button><button id="tabSSQ">双色球</button></div></div>
<div class="main" id="main"></div>
<div class="bottom"><button id="navDraw" class="active">走势</button><button id="navBook">账本</button><button id="navInfo">免责</button></div>
<div id="toast" class="hidden"></div>
<div id="ruleModal" class="rule-modal hidden"><div id="ruleContent" class="rule-content"></div></div>

<script>
(function(){
// ==================== 内置默认数据 ====================
const K8_DEF=[{period:'2026134',date:'2026-05-24',numbers:[6,12,19,20,21,22,27,30,31,32,34,42,51,54,57,66,70,71,72,75]},{period:'2026133',date:'2026-05-23',numbers:[1,6,9,16,18,19,21,26,27,29,55,58,59,60,62,66,73,74,76,80]},{period:'2026132',date:'2026-05-22',numbers:[2,6,10,14,19,23,27,30,34,38,41,45,48,51,55,58,62,66,70,75]},{period:'2026131',date:'2026-05-21',numbers:[4,8,12,16,21,26,32,37,43,50,54,59,63,67,71,73,76,77,78,79]},{period:'2026130',date:'2026-05-20',numbers:[3,11,15,19,22,25,28,31,35,39,42,44,47,50,53,57,60,64,68,72]},{period:'2026129',date:'2026-05-19',numbers:[1,5,9,13,17,20,24,27,30,34,38,41,45,48,52,56,59,63,67,71]},{period:'2026128',date:'2026-05-18',numbers:[2,6,10,14,18,23,26,29,33,36,40,43,46,49,51,55,58,62,66,70]},{period:'2026127',date:'2026-05-17',numbers:[4,8,12,16,21,25,32,37,44,50,54,57,61,65,69,73,74,76,78,80]},{period:'2026126',date:'2026-05-16',numbers:[3,7,11,15,19,22,26,30,34,38,42,45,48,51,54,58,62,66,70,74]},{period:'2026125',date:'2026-05-15',numbers:[1,5,9,13,17,20,24,28,31,35,39,43,46,50,53,56,60,64,68,72]}];
const SSQ_DEF=[{period:'2026058',date:'2026-05-24',reds:[1,4,7,21,29,30],blue:1},{period:'2026057',date:'2026-05-21',reds:[1,10,22,24,28,30],blue:7},{period:'2026056',date:'2026-05-19',reds:[10,19,21,22,31,33],blue:5},{period:'2026055',date:'2026-05-17',reds:[4,11,24,25,32,33],blue:13},{period:'2026054',date:'2026-05-14',reds:[13,20,25,29,30,33],blue:2},{period:'2026053',date:'2026-05-12',reds:[1,2,3,8,13,14],blue:2},{period:'2026052',date:'2026-05-10',reds:[1,3,11,22,26,31],blue:11},{period:'2026051',date:'2026-05-07',reds:[9,14,15,16,29,30],blue:10},{period:'2026050',date:'2026-05-05',reds:[6,9,25,27,28,30],blue:3},{period:'2026049',date:'2026-05-03',reds:[3,4,14,15,18,20],blue:2}];

const S={tab:'k8',page:'draw',k8Data:null,ssqData:null,k8H:[],ssqH:[],bets:[]};
const z16=n=>Math.ceil(n/5), z7=n=>n<=5?1:n<=10?2:n<=15?3:n<=20?4:n<=25?5:n<=30?6:7;
function sortN(a,b){return a-b;}

// ==================== 存储 ====================
function load(){
    try{const d=JSON.parse(localStorage.getItem('lottery_vfinal'));if(d){S.bets=d.bets||[];S.k8H=d.k8H||[];S.ssqH=d.ssqH||[];S.k8Data=d.k8Data||null;S.ssqData=d.ssqData||null;}}catch(e){}
    if(!S.k8H.length)S.k8H=K8_DEF.slice();if(!S.ssqH.length)S.ssqH=SSQ_DEF.slice();
    if(!S.k8Data)S.k8Data=S.k8H[0];if(!S.ssqData)S.ssqData=S.ssqH[0];
}
function save(){localStorage.setItem('lottery_vfinal',JSON.stringify({bets:S.bets,k8H:S.k8H.slice(0,60),ssqH:S.ssqH.slice(0,60),k8Data:S.k8Data,ssqData:S.ssqData}));}

// ==================== Toast ====================
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2000);}

// ==================== 复制 ====================
function copyText(text){
    if(!text)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('✅ 已复制')).catch(()=>fallbackCopy(text));}
    else fallbackCopy(text);
}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}document.body.removeChild(ta);}

// ==================== 手动录入 ====================
function openManual(){
    const tab=S.tab;
    let formHtml='';
    if(tab==='k8'){
        formHtml='<h3>手动录入快乐8开奖号</h3><input id="manPeriod" placeholder="期号" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manNums" placeholder="20个号码(空格分隔)" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><button class="btn btn-primary" id="saveManK8" style="width:100%">保存并更新</button>';
    }else{
        formHtml='<h3>手动录入双色球开奖号</h3><input id="manPeriod" placeholder="期号" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manReds" placeholder="6个红球(空格分隔)" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><input id="manBlue" placeholder="蓝球" style="width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc"><button class="btn btn-primary" id="saveManSSQ" style="width:100%">保存并更新</button>';
    }
    const modal=document.createElement('div');
    modal.className='rule-modal';
    modal.innerHTML='<div class="rule-content">'+formHtml+'<button class="btn" style="width:100%;margin-top:12px" id="closeManual">关闭</button></div>';
    document.body.appendChild(modal);
    document.getElementById('closeManual').onclick=()=>modal.remove();
    modal.onclick=function(e){if(e.target===modal) modal.remove();};
    if(tab==='k8'){
        document.getElementById('saveManK8').onclick=()=>{
            const period=document.getElementById('manPeriod').value.trim();
            const numsStr=document.getElementById('manNums').value.trim();
            if(!period||!numsStr) return alert('请填写完整');
            const numbers=numsStr.split(/\s+/).map(Number).filter(n=>n>=1&&n<=80).sort(sortN);
            if(numbers.length!==20) return alert('需20个号码');
            S.k8Data={period,date:new Date().toISOString().slice(0,10),numbers};
            const idx=S.k8H.findIndex(h=>h.period===period);
            if(idx>=0) S.k8H[idx]=S.k8Data; else S.k8H.unshift(S.k8Data);
            save(); modal.remove(); render(); toast('快乐8数据已更新');
        };
    }else{
        document.getElementById('saveManSSQ').onclick=()=>{
            const period=document.getElementById('manPeriod').value.trim();
            const redsStr=document.getElementById('manReds').value.trim();
            const blue=parseInt(document.getElementById('manBlue').value);
            if(!period||!redsStr||isNaN(blue)) return alert('请填写完整');
            const reds=redsStr.split(/\s+/).map(Number).filter(n=>n>=1&&n<=33).sort(sortN);
            if(reds.length!==6) return alert('红球需6个'); if(blue<1||blue>16) return alert('蓝球1-16');
            S.ssqData={period,date:new Date().toISOString().slice(0,10),reds,blue};
            const idx=S.ssqH.findIndex(h=>h.period===period);
            if(idx>=0) S.ssqH[idx]=S.ssqData; else S.ssqH.unshift(S.ssqData);
            save(); modal.remove(); render(); toast('双色球数据已更新');
        };
    }
}

// ==================== 算法 ====================
function get16ZoneStats(h,n=8){
    const r=h.slice(0,n);const c={};for(let z=1;z<=16;z++)c[z]=0;
    r.forEach(d=>d.numbers.forEach(num=>c[z16(num)]++));
    const s=Object.entries(c).sort((a,b)=>a[1]-b[1]);
    const cold=new Set(s.slice(0,4).map(e=>+e[0]));
    const hot=new Set(s.slice(12,16).map(e=>+e[0]));
    const warm=new Set();for(let z=1;z<=16;z++)if(!cold.has(z)&&!hot.has(z))warm.add(z);
    return{counts:c,hot,warm,cold};
}
function getActiveNumbers(h){
    if(h.length<5)return[];
    const r5=h.slice(0,5),r4=h.slice(0,4),r10=h.slice(0,Math.min(10,h.length));
    const zc={};for(let z=1;z<=16;z++)zc[z]=0;
    r5.forEach(d=>d.numbers.forEach(num=>zc[z16(num)]++));
    const top5=new Set(Object.entries(zc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>+e[0]));
    const zNums=new Set();for(let i=1;i<=80;i++)if(top5.has(z16(i)))zNums.add(i);
    const f4={};for(let i=1;i<=80;i++)f4[i]=0;
    r4.forEach(d=>d.numbers.forEach(num=>{if(zNums.has(num))f4[num]++;}));
    let cand=Object.entries(f4).filter(e=>e[1]>=2).map(e=>+e[0]);
    const cons={};cand.forEach(num=>{
        let f=false;for(let i=0;i<r10.length-1;i++)if(r10[i].numbers.includes(num)&&r10[i+1].numbers.includes(num)){f=true;break;}
        cons[num]=f;
    });
    cand=cand.filter(num=>cons[num]);
    if(cand.length<4)cand=Object.entries(f4).filter(e=>e[1]>=1).map(e=>+e[0]).filter(n=>zNums.has(n));
    cand.sort((a,b)=>(f4[b]||0)-(f4[a]||0)||a-b);
    return cand.slice(0,7).sort(sortN);
}
function getWarmNumbers(h,n=8){
    const r=h.slice(0,n);const f={};
    r.forEach(d=>d.numbers.forEach(num=>f[num]=(f[num]||0)+1));
    return Object.entries(f).filter(e=>e[1]>=2).map(e=>+e[0]);
}
function genK8Combos(h){
    if(h.length<3)return[];
    const act=getActiveNumbers(h);const warm=getWarmNumbers(h,8);
    let pool=warm.filter(n=>!act.includes(n));
    if(pool.length<20){
        const r8=h.slice(0,8);const f1={};
        r8.forEach(d=>d.numbers.forEach(num=>f1[num]=(f1[num]||0)+1));
        const others=Object.keys(f1).map(Number).filter(n=>!act.includes(n)&&!pool.includes(n));
        pool.push(...others);
    }
    pool=[...new Set(pool)].sort(sortN);
    while(pool.length<30){const rn=Math.floor(Math.random()*80)+1;if(!pool.includes(rn)&&!act.includes(rn))pool.push(rn);}
    pool.sort(sortN);
    const seed=parseInt((h[0].period||'2025001').replace(/\D/g,'')||'2025001');
    const rand=s=>{let v=s;return()=>(v=(v*1103515245+12345)&0x7fffffff)/0x7fffffff;};
    const rng=rand(seed);const pick=(arr,c)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,c).sort(sortN);};
    const combos=[];
    for(let i=0;i<5;i++){let sel=act.length>=4?pick(act,4):[...act];const need=6-sel.length;if(need>0)sel=[...sel,...pick(pool.filter(n=>!sel.includes(n)),need)];while(sel.length<6){const rn=Math.floor(Math.random()*80)+1;if(!sel.includes(rn))sel.push(rn);}combos.push({type:'选6',numbers:sel.sort(sortN)});}
    let sel7=act.length>=4?pick(act,4):[...act];const need7=7-sel7.length;if(need7>0)sel7=[...sel7,...pick(pool.filter(n=>!sel7.includes(n)),need7)];while(sel7.length<7){const rn=Math.floor(Math.random()*80)+1;if(!sel7.includes(rn))sel7.push(rn);}combos.push({type:'选7',numbers:sel7.sort(sortN)});
    return combos;
}
function getSSQHotReds(h,n=30){const r=h.slice(0,Math.min(n,h.length));if(!r.length)return[];const f={};for(let i=1;i<=33;i++)f[i]=0;r.forEach(d=>d.reds.forEach(rr=>f[rr]++));return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>+e[0]);}
function getPanel1(h,n=30){const r=h.slice(0,Math.min(n,h.length));if(r.length<2)return[];const rm={};for(let i=0;i<r.length-1;i++){const cur=new Set(r[i].reds),nxt=new Set(r[i+1].reds);cur.forEach(num=>{if(!rm[num])rm[num]={t:0,r:0};rm[num].t++;if(nxt.has(num))rm[num].r++;});}const cand=[];for(let num=1;num<=33;num++)if(rm[num]&&rm[num].t>=2&&(rm[num].r/rm[num].t)>=0.5)cand.push(num);return cand.length?cand.sort(sortN):getSSQHotReds(h,n);}
function getPanel2(h,n=6){const r=h.slice(0,Math.min(n,h.length));if(r.length<3)return getSSQHotReds(h,30);const zc={};for(let z=1;z<=7;z++)zc[z]=0;r.forEach(d=>d.reds.forEach(rr=>zc[z7(rr)]++));const sz=Object.entries(zc).sort((a,b)=>a[1]-b[1]);const coldZ=new Set(sz.slice(0,2).map(e=>+e[0]));const hotZ=new Set(sz.slice(5,7).map(e=>+e[0]));const nf={};for(let i=1;i<=33;i++)nf[i]=0;r.forEach(d=>d.reds.forEach(rr=>nf[rr]++));const sn=Object.entries(nf).sort((a,b)=>a[1]-b[1]);const coldN=new Set(sn.slice(0,11).map(e=>+e[0]));const hotN=new Set(sn.slice(22,33).map(e=>+e[0]));const om={};for(let i=1;i<=33;i++){let o=0;for(let j=0;j<r.length;j++){if(r[j].reds.includes(i))break;o++;}om[i]=o;}const cand=[];for(let i=1;i<=33;i++){if(coldZ.has(z7(i))||coldN.has(i)||om[i]>=3)continue;cand.push(i);}cand.sort((a,b)=>(hotN.has(b)?1:0)-(hotN.has(a)?1:0)||(hotZ.has(z7(b))?1:0)-(hotZ.has(z7(a))?1:0));const result=cand.slice(0,6).sort(sortN);return result.length?result:getSSQHotReds(h,30).slice(0,6);}
function getPanel3(h,tn=30,rn=6){const r30=h.slice(0,Math.min(tn,h.length));const r6=h.slice(0,Math.min(rn,h.length));if(r30.length<5)return getSSQHotReds(h,30);const tm={};for(let i=0;i<r30.length-1;i++){const ct=new Set(r30[i].reds.map(r=>r%10));const nt=r30[i+1].reds.map(r=>r%10);ct.forEach(t=>{if(!tm[t])tm[t]={};nt.forEach(n=>tm[t][n]=(tm[t][n]||0)+1);});}const hpt=new Set();for(let t=0;t<=9;t++){if(tm[t]){const total=Object.values(tm[t]).reduce((a,b)=>a+b,0);if(total>=2)for(let n=0;n<=9;n++)if(tm[t][n]&&tm[t][n]/total>=0.5)hpt.add(n);}}const rnSet=new Set();r6.forEach(d=>d.reds.forEach(r=>rnSet.add(r)));const cand=[];for(let num of rnSet)if(hpt.has(num%10))cand.push(num);const result=[...new Set(cand)].sort(sortN);return result.length?result:getSSQHotReds(h,30);}
function genSSQCombos(h){if(!h.length)return[];const rf={},bf={};for(let i=1;i<=33;i++)rf[i]=0;for(let i=1;i<=16;i++)bf[i]=0;h.slice(0,10).forEach(d=>{d.reds.forEach(r=>rf[r]++);bf[d.blue]++;});const mids=[];for(let i=1;i<=33;i++)if(rf[i]>=1&&rf[i]<=4)mids.push(i);const hb=[];for(let i=1;i<=16;i++)if(bf[i]>=1)hb.push(i);const seed=parseInt((h[0].period||'2025057').replace(/\D/g,'')||'2025057');const rand=s=>{let v=s;return()=>(v=(v*1103515245+12345)&0x7fffffff)/0x7fffffff;};const rng=rand(seed);const pick=(arr,c)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,c).sort(sortN);};const pool=mids.length>=12?mids:Object.keys(rf).map(Number).filter(n=>rf[n]<=5);const bPool=hb.length>=4?hb:Array.from({length:16},(_,i)=>i+1);const combos=[];for(let i=0;i<5;i++){const reds=pick([...pool],6);const blue=pick([...bPool],1)[0];if(reds.length===6&&blue)combos.push({reds,blue});}return combos;}

// ==================== 自动投注结算 ====================
function autoBetK8(period){if(!S.k8Data||S.bets.some(b=>b.period===period&&b.gameType==='k8'))return;const combos=genK8Combos(S.k8H);combos.forEach(c=>{S.bets.unshift({id:Date.now()+Math.random(),gameType:'k8',playType:c.type==='选7'?'x7':'x6',numbers:c.numbers,amount:2,multi:1,status:'pending',period,createdAt:new Date().toISOString()});});save();toast('已自动投注6注');}
function autoSettle(){const pending=S.bets.filter(b=>b.status==='pending');if(!pending.length)return;pending.forEach(b=>{if(b.gameType==='k8'&&S.k8Data){const hits=b.numbers.filter(n=>S.k8Data.numbers.includes(n)).length;const fixed={x6:{6:'jackpot',5:28,4:3},x7:{7:'jackpot',6:288,5:28,4:4}};const p=fixed[b.playType]?.[hits];b.winAmount=p==='jackpot'?b.amount*5000:(typeof p==='number'?p*(b.multi||1):0);b.status='settled';}else if(b.gameType==='ssq'&&S.ssqData){const rh=b.reds.filter(r=>S.ssqData.reds.includes(r)).length;const bh=b.blue===S.ssqData.blue;const multi=b.multi||1;b.winAmount=rh===6&&bh?b.amount*2500:rh===6?b.amount*500:rh===5&&bh?3000*multi:rh===5||(rh===4&&bh)?200*multi:rh===4||(rh===3&&bh)?10*multi:bh?5*multi:0;b.status='settled';}});save();toast('已结算');}

// ==================== 同步 ====================
async function syncData(){
    toast('更新中…');let updated=false;
    try{
        const[k8r,ssqr]=await Promise.all([fetch('https://m.zhcw.com/clienth5.do?lottery=FC_KL8&pageSize=1&pageNo=1&transactionType=300301'),fetch('https://m.zhcw.com/clienth5.do?lottery=FC_SSQ&pageSize=1&pageNo=1&transactionType=300301')]);
        if(k8r.ok){const j=await k8r.json();if(j?.dataList?.[0]){const it=j.dataList[0];const nums=it.kjznum.split(' ').map(Number).sort(sortN);if(nums.length===20){S.k8Data={period:it.kjIssue,date:it.kjdate,numbers:nums};const idx=S.k8H.findIndex(h=>h.period===it.kjIssue);if(idx>=0)S.k8H[idx]=S.k8Data;else S.k8H.unshift(S.k8Data);updated=true;}}}
        if(ssqr.ok){const j=await ssqr.json();if(j?.dataList?.[0]){const it=j.dataList[0];const reds=it.kjznum.split(' ').map(Number).sort(sortN);const blue=parseInt(it.kjtnum);if(reds.length===6&&blue>=1&&blue<=16){S.ssqData={period:it.kjIssue,date:it.kjdate,reds,blue};const idx=S.ssqH.findIndex(h=>h.period===it.kjIssue);if(idx>=0)S.ssqH[idx]=S.ssqData;else S.ssqH.unshift(S.ssqData);updated=true;}}}
        save();
        if(updated){toast('✅ 数据已更新');}else{toast('⚠️ 暂无新数据，可手动录入');}
    }catch(e){toast('❌ 网络失败，可手动录入');}
    autoSettle();render();
}

// ==================== 规则弹窗 ====================
function openRule(type){
    const modal=document.getElementById('ruleModal'),content=document.getElementById('ruleContent');
    const rules={zone16:'<h3>16区统计规则</h3><p>1-80每5个号码分为1区，共16区。<br>统计近8期各区出号次数，最多的4个区为“热区”，最少的4个为“冷区”，其余为“温区”。</p>',active:'<h3>活跃号码筛选规则</h3><p>第一步：16区中取近5期出号最多的5个区，保留区内号码。<br>第二步：从保留号码中选出近4期出现≥2次的热温码。<br>第三步：检查近10期是否有连出现象，无连出的剔除。<br>最终取最多7个号码升序排列。</p>',combo:'<h3>复盘组合生成规则</h3><p>从活跃号码中强制选取4个（不足则全选），再搭配近8期温热号码补足6或7个，生成5注选6和1注选7。</p>',ssq_p1:'<h3>板块1：4区重号概率</h3><p>将1-33分为4个区。统计近30期，计算每个号码在上一期出现后下一期连出的概率，筛选概率≥50%的号码。</p>',ssq_p2:'<h3>板块2：7区冷热温+遗漏排除</h3><p>将1-33分为7个区。统计近6期各区、各号码频次，划分热温冷；排除冷区、冷号及遗漏≥3期的号码，优先热号热区，取最多6个。</p>',ssq_p3:'<h3>板块3：尾号跟随</h3><p>统计近30期每个尾号(0-9)在上一期出现后下一期会跟随的尾号概率，筛选概率≥50%的尾号对。从近6期出现过的号码中选出对应尾号的号码。</p>'};
    content.innerHTML='<div>'+rules[type]+'<button class="btn" style="width:100%;margin-top:16px" onclick="document.getElementById(\'ruleModal\').classList.add(\'hidden\')">关闭</button></div>';
    modal.classList.remove('hidden');
    modal.onclick=function(e){if(e.target===modal) modal.classList.add('hidden');};
}

// ==================== 渲染 ====================
function render(){
    const m=document.getElementById('main');
    if(S.page==='draw'){
        if(S.tab==='k8'){
            const k=S.k8Data;const{counts,hot,warm,cold}=get16ZoneStats(S.k8H,8);
            const act=getActiveNumbers(S.k8H);const combos=genK8Combos(S.k8H);
            let h='<div class="card"><div class="title">快乐8 最新开奖 <span style="font-weight:normal;font-size:0.8rem">'+(k?k.period+'期 | '+k.date:'---')+'</span></div><div class="balls">'+(k?k.numbers.map(n=>'<span class="ball k8-red">'+n+'</span>').join(''):'暂无')+'</div><button class="btn" onclick="syncData()">🔄 刷新</button> <button class="btn" onclick="openManual()">✍️ 手动录入</button></div>';
            h+='<div class="card"><div class="title"><span>16区统计(近8期)</span><button class="btn-rule rule-btn" data-rule="zone16">规则</button></div><div class="zone-grid">';
            for(let z=1;z<=16;z++){
                const cls=hot.has(z)?'hot':warm.has(z)?'warm':'cold';
                const tag=hot.has(z)?'🔥 热':warm.has(z)?'🟠 温':'🔵 冷';
                const start=(z-1)*5+1,end=z*5;
                h+='<div class="zone-item '+cls+'"><div>'+(start<10?'0'+start:start)+'-'+(end<10?'0'+end:end)+'</div><div>'+counts[z]+'次</div><div>'+tag+'</div></div>';
            }
            h+='</div></div>';
            h+='<div class="card"><div class="title"><span>近3-4期活跃号码</span><button class="btn-rule rule-btn" data-rule="active">规则</button></div><div class="balls">'+(act.length?act.map(n=>'<span class="ball k8-red small-ball">'+n+'</span>').join(''):'暂无')+'</div></div>';
            h+='<div class="card"><div class="title"><span>走势复盘组合</span><button class="btn-rule rule-btn" data-rule="combo">规则</button></div>';
            if(combos.length)combos.forEach(c=>{h+='<div style="display:flex;align-items:center;gap:8px;margin:8px 0"><div class="balls">'+c.numbers.map(n=>'<span class="ball k8-red small-ball">'+n+'</span>').join('')+'</div><span style="font-weight:600">'+c.type+'</span><button class="btn-copy copy-btn" data-copy="'+c.numbers.join(',')+'">📋 复制</button></div>';});
            else h+='<p style="color:#999">需≥3期历史</p>';
            h+='<p style="font-size:0.7rem;color:#999">系统已自动投注每注2元</p></div>';
            m.innerHTML=h;
        }else{
            const s=S.ssqData;const hotR=getSSQHotReds(S.ssqH,30);
            const p1=getPanel1(S.ssqH,30),p2=getPanel2(S.ssqH,6),p3=getPanel3(S.ssqH,30,6);
            const combos=genSSQCombos(S.ssqH);
            let h='<div class="card"><div class="title">双色球 最新开奖 <span style="font-weight:normal;font-size:0.8rem">'+(s?s.period+'期 | '+s.date:'---')+'</span></div><div class="balls">'+(s?s.reds.map(n=>'<span class="ball ssq-red">'+n+'</span>').join('')+'<span class="ball ssq-blue">'+s.blue+'</span>':'暂无')+'</div><button class="btn" onclick="syncData()">🔄 刷新</button> <button class="btn" onclick="openManual()">✍️ 手动录入</button></div>';
            h+='<div class="card"><div class="title">4胆参考(近30期热号)</div><div class="balls">'+(hotR.length?hotR.map(n=>'<span class="ball ssq-red">'+n+'</span>').join(''):'数据不足')+'</div>'+(hotR.length?'<div style="margin-top:6px"><button class="btn-copy copy-btn" data-copy="'+hotR.join(',')+'">📋 复制4胆</button></div>':'')+'</div>';
            h+='<div class="card"><div class="title"><span>板块1：4区重号概率</span><button class="btn-rule rule-btn" data-rule="ssq_p1">规则</button></div><div class="balls">'+(p1.length?p1.map(n=>'<span class="ball ssq-red">'+n+'</span>').join(''):'暂无')+'</div>'+(p1.length?'<div style="margin-top:6px"><button class="btn-copy copy-btn" data-copy="'+p1.join(',')+'">📋 复制</button></div>':'')+'</div>';
            h+='<div class="card"><div class="title"><span>板块2：7区冷热温+遗漏排除</span><button class="btn-rule rule-btn" data-rule="ssq_p2">规则</button></div><div class="balls">'+(p2.length?p2.map(n=>'<span class="ball ssq-red">'+n+'</span>').join(''):'暂无')+'</div>'+(p2.length?'<div style="margin-top:6px"><button class="btn-copy copy-btn" data-copy="'+p2.join(',')+'">📋 复制</button></div>':'')+'</div>';
            h+='<div class="card"><div class="title"><span>板块3：尾号跟随</span><button class="btn-rule rule-btn" data-rule="ssq_p3">规则</button></div><div class="balls">'+(p3.length?p3.map(n=>'<span class="ball ssq-red">'+n+'</span>').join(''):'暂无')+'</div>'+(p3.length?'<div style="margin-top:6px"><button class="btn-copy copy-btn" data-copy="'+p3.join(',')+'">📋 复制</button></div>':'')+'</div>';
            h+='<div class="card"><div class="title">历史走势参考单式</div>';
            if(combos.length)combos.forEach(c=>{h+='<div style="display:flex;align-items:center;gap:8px;margin:8px 0"><div class="balls">'+c.reds.map(n=>'<span class="ball ssq-red small-ball">'+n+'</span>').join('')+'<span class="ball ssq-blue small-ball">'+c.blue+'</span></div><button class="btn-copy copy-btn" data-copy="'+c.reds.join(',')+' + '+c.blue+'">📋 复制</button></div>';});
            else h+='<p style="color:#999">需≥3期历史</p>';
            h+='</div>';
            m.innerHTML=h;
        }
        m.querySelectorAll('.copy-btn').forEach(b=>b.onclick=function(e){e.preventDefault();copyText(this.getAttribute('data-copy'));});
        m.querySelectorAll('.rule-btn').forEach(b=>b.onclick=function(e){e.preventDefault();openRule(this.getAttribute('data-rule'));});
    }else if(S.page==='book'){
        const ti=S.bets.reduce((a,b)=>a+(b.amount||0),0),to=S.bets.filter(b=>b.status==='settled').reduce((a,b)=>a+(b.winAmount||0),0);
        m.innerHTML='<div class="card"><div class="title">模拟账本</div><p>总投注：'+ti+'元</p><p>总中奖：'+to+'元</p><p>净盈亏：'+(to-ti)+'元</p><button class="btn" onclick="autoSettle();render();">🔄 手动结算</button></div>';
    }else{
        m.innerHTML='<div class="card"><p>⚠️ 彩票开奖完全随机，往期数据不影响下期结果。<br>本工具仅供个人娱乐记录，无任何预测功能。禁止用于商业或购彩参考。</p></div>';
    }
}

// ==================== 页面切换 ====================
function switchTab(t){S.tab=t;document.getElementById('tabK8').classList.toggle('active',t==='k8');document.getElementById('tabSSQ').classList.toggle('active',t==='ssq');render();}
function switchPage(p){S.page=p;['navDraw','navBook','navInfo'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(p==='draw'?'navDraw':p==='book'?'navBook':'navInfo').classList.add('active');render();}
document.getElementById('tabK8').onclick=()=>switchTab('k8');
document.getElementById('tabSSQ').onclick=()=>switchTab('ssq');
document.getElementById('navDraw').onclick=()=>switchPage('draw');
document.getElementById('navBook').onclick=()=>switchPage('book');
document.getElementById('navInfo').onclick=()=>switchPage('disclaimer');

load();render();syncData();
})();
</script>
